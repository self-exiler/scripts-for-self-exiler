# GitHub Actions 发布流水线模板（来自 ComfyuiLauncher 实战经验）
# 推 v* 标签 → 测试 → 构建 → 自动建 Release 附产物
# 手动 workflow_dispatch → 仅构建 + 上传 Actions 产物，不建 Release（验证管线用）
# 构建唯一入口是 installer/build.ps1，本地与云端同源，不在工作流里复述构建步骤。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '产物版本号（如 0.1.0beta，不带 v 前缀）'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: 编译并发布安装包
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 安装 WiX v5 命令行（Bundle 扩展由 build.ps1 自动补装）
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      # ---- Android job 如需并行出 APK，复制此 job 到 ubuntu-latest：
      # - uses: actions/setup-java@v4
      #   with: { distribution: temurin, java-version: '17' }
      # - 解码 secrets.KEYSTORE_BASE64 到 keystore 文件
      # - dotnet publish -f net10.0-android -p:AndroidPackageFormat=apk
      # ----

      - name: 确定版本号（tag 优先去 v 前缀，手动触发用输入值）
        id: ver
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'
          if (-not $v) { $v = ($env:GITHUB_REF_NAME -replace '^v', '') }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Output "版本号：$v"

      # 项目带测试代码则必须保留此步骤；无测试项目可删除
      - name: 运行测试
        shell: pwsh
        run: dotnet test --configuration Release --nologo

      # 编译方式由 build.ps1 参数决定（默认 JIT；加 -R2R / -AOT；-Full 出自包含 MSI）
      - name: 构建
        shell: pwsh
        run: ./installer/build.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: 上传构建产物（Actions 页面可下载）
        uses: actions/upload-artifact@v7
        with:
          name: AppName-windows-x64-${{ steps.ver.outputs.version }}
          path: |
            installer/output/*.exe
            installer/output/*.msi
          if-no-files-found: error

      - name: 创建 GitHub Release 并附安装包
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            installer/output/*.exe
            installer/output/*.msi
          generate_release_notes: true
          fail_on_unmatched_files: true
